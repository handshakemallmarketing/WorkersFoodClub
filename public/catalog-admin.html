<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalog Administration — Workers Food Club</title><link rel="stylesheet" href="/styles.css"></head><body><main style="max-width:1000px;margin:auto;padding:2rem"><p class="eyebrow">Administration · Catalog</p><h1>Product Catalog</h1><p id="catalog-access">Verifying catalog authority…</p><section class="card"><h2>Categories</h2><form id="category-form" hidden><label>Category ID <input name="categoryId" required></label><label>Name <input name="name" required></label><button class="primary" type="submit">Add category</button></form><div id="category-list"></div></section><section class="card"><h2>Publish product / SKU</h2><form id="catalog-form" hidden><label>Specification ID <input name="specificationId" required></label><label>Version <input name="specificationVersion" type="number" min="1" required></label><label>Product name <input name="specificationName" required></label><label>Category <select name="categoryId" id="category-select" required></select></label><label>Base unit <input name="baseUnit" required></label><label>Listing ID <input name="listingId" required></label><label>SKU <input name="sku" required></label><label>Display name <input name="displayName" required></label><button class="primary" type="submit">Publish</button></form><p id="catalog-result" aria-live="polite"></p></section><section class="card"><h2>Current listings</h2><div id="catalog-list">Loading…</div></section><section class="card"><h2>Sell a listing (create/update offer)</h2><p class="bootstrap-status">An offer is what members actually see and order: price, quantity, capacity, and timing for an active listing above.</p><form id="offer-form" hidden><label>Offer ID <input name="offerId" required></label><label>Listing <select name="listingId" id="offer-listing-select" required></select></label><label>Name <input name="name" required></label><label>Description <textarea name="description" required></textarea></label><label>Unit quantity <input name="unitQuantity" type="number" step="any" min="0.0001" required></label><label>Unit <input name="unit" required></label><label>Price (GHS) <input name="priceGhs" type="number" step="0.01" min="0" required></label><label>Fulfillment method <select name="fulfillmentMethod"><option value="PICKUP">Pickup</option><option value="DELIVERY">Delivery</option></select></label><label>Status <select name="status"><option value="COMING_SOON">Coming soon</option><option value="OPEN">Open</option><option value="CLOSED">Closed</option></select></label><label>Sort order <input name="sortOrder" type="number" step="1" value="0"></label><label>Min order quantity <input name="minOrderQuantity" type="number" step="any" min="0"></label><label>Max order quantity <input name="maxOrderQuantity" type="number" step="any" min="0"></label><label>Campaign capacity <input name="campaignCapacity" type="number" step="any" min="0"></label><label>Delivery at <input name="deliveryAt" type="datetime-local"></label><label>Discount deadline at <input name="discountDeadlineAt" type="datetime-local"></label><label>Full-payment discount (%) <input name="discountPct" type="number" step="0.01" min="0" max="100" value="0"></label><label>Qualified-demand payment threshold (%) <input name="demandQualificationPct" type="number" step="0.01" min="0.01" max="100" value="30" required></label><button class="primary" type="submit">Save offer</button></form><p id="offer-result" aria-live="polite"></p><div id="offer-list">Loading…</div></section></main><script src="/governed-fetch-extension.js"></script><script src="/auth.js"></script><script src="/catalog-admin.js"></script></body></html>
