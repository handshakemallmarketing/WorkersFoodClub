<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Food Club Ghana — Household activation</title><link rel="stylesheet" href="/styles.css"><style>body{display:flex;justify-content:center;padding:48px 20px}.card{max-width:520px;width:100%;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}#result{margin-top:18px;border-radius:12px;padding:14px;line-height:1.5}.ok{background:var(--green2);color:var(--green)}.err{background:var(--redbg);color:var(--red)}</style></head><body><main class="card"><p class="eyebrow">Household membership</p><h1>Activate your household membership</h1><p>This invitation gives you your own WorkersFoodClub identity and Member ID under the sponsoring member's household. Invitation approval does not provide access until you complete this activation.</p><div id="gsi-target"></div><p id="status"></p><div id="result" hidden></div></main><script>(()=>{const status=document.getElementById('status'),result=document.getElementById('result'),target=document.getElementById('gsi-target');const token=()=>{const v=location.hash.replace(/^#/,'');try{return v?decodeURIComponent(v):''}catch{return''}};function show(ok,text){status.textContent='';result.hidden=false;result.className=ok?'ok':'err';result.textContent=text}async function activate(credential){const invitationToken=token();if(!invitationToken)return show(false,'This activation link is missing its invitation token. Ask the sponsoring member for a new invitation.');status.textContent='Activating household membership…';try{const response=await fetch('/api/household-activate',{method:'POST',headers:{Authorization:`Bearer ${credential}`,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({token:invitationToken})});const body=await response.json().catch(()=>null);if(response.ok&&body?.ok){history.replaceState(null,'',location.pathname);return show(true,`Household membership activated. Your Member ID is ${body.publicMemberId}. You can now return to WorkersFoodClub and sign in normally.`)}show(false,`Activation could not be completed: ${body?.error||`HTTP ${response.status}`}`)}catch{show(false,'Activation request failed. Check your connection and try again.')}}function loadGoogle(){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.defer=true;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}async function init(){if(!token())return show(false,'This link is missing its invitation token. Ask the sponsoring member to resend the complete link.');status.textContent='Loading sign-in…';let config;try{const r=await fetch('/api/auth-client-config',{headers:{Accept:'application/json'},cache:'no-store'});config=await r.json()}catch{return show(false,'Could not load sign-in configuration.')}if(!config?.configured||config.provider!=='google'||!config.clientId)return show(false,'Google sign-in is not configured on this deployment.');if(config.productionApplicationAccessEnabled!==true)return show(false,'Production application access is currently disabled.');try{await loadGoogle()}catch{return show(false,'Google Sign-In failed to load.')}status.textContent='';google.accounts.id.initialize({client_id:config.clientId,callback:r=>r?.credential&&activate(r.credential),auto_select:false,cancel_on_tap_outside:true});google.accounts.id.renderButton(target,{type:'standard',theme:'outline',size:'large',text:'signin_with',width:300})}init()})();</script></body></html>
