<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Food Club Ghana — Household activation</title><link rel="stylesheet" href="/styles.css"><style>body{display:flex;justify-content:center;padding:48px 20px}.card{max-width:520px;width:100%;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}#result{margin-top:18px;border-radius:12px;padding:14px;line-height:1.5}.ok{background:var(--green2);color:var(--green)}.err{background:var(--redbg);color:var(--red)}</style></head><body><main class="card"><p class="eyebrow">Household membership</p><h1>Activate your household membership</h1><p>This single-use invitation activates your household membership and issues your own WorkersFoodClub Member ID. Google is not required.</p><button id="activate" type="button">Activate membership</button><p id="status"></p><div id="result" hidden></div></main><script>(()=>{const status=document.getElementById('status'),result=document.getElementById('result'),button=document.getElementById('activate');const token=()=>{const v=location.hash.replace(/^#/,'');try{return v?decodeURIComponent(v):''}catch{return''}};function show(ok,text){status.textContent='';result.hidden=false;result.className=ok?'ok':'err';result.textContent=text}async function activate(){const invitationToken=token();if(!invitationToken)return show(false,'This activation link is missing its invitation token. Ask the sponsoring member for a new invitation.');button.disabled=true;status.textContent='Activating household membership…';try{const response=await fetch('/api/household-activate',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({token:invitationToken})});const body=await response.json().catch(()=>null);if(response.ok&&body?.ok){history.replaceState(null,'',location.pathname);return show(true,`Household membership activated. Your Member ID is ${body.publicMemberId}. You can now sign in using your Member ID and registered contact.`)}button.disabled=false;show(false,`Activation could not be completed: ${body?.error||`HTTP ${response.status}`}`)}catch{button.disabled=false;show(false,'Activation request failed. Check your connection and try again.')}}if(!token()){button.disabled=true;show(false,'This link is missing its invitation token. Ask the sponsoring member to resend the complete link.')}else button.addEventListener('click',activate)})();</script></body></html>
