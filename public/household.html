<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Food Club Ghana — Household members</title><link rel="stylesheet" href="/styles.css"><style>body{display:flex;justify-content:center;padding:48px 20px}.card{max-width:600px;width:100%;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}label{display:block;margin:14px 0 5px}input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px}.result{margin-top:16px;padding:14px;border-radius:10px;background:var(--green2);word-break:break-all}</style></head><body><main class="card"><p class="eyebrow">Member household</p><h1>Invite a household beneficiary</h1><p>Each primary membership includes up to two household beneficiary slots. The invited person must activate with their own Google identity before receiving member access.</p><div id="gsi-target"></div><form id="form" hidden><label for="email">Email</label><input id="email" type="email" autocomplete="email"><label for="phone">Phone (optional)</label><input id="phone" type="tel" autocomplete="tel"><div class="hero-actions"><button class="primary" type="submit">Create invitation</button><a class="secondary" href="/">Back</a></div></form><p id="status"></p><div id="result" class="result" hidden></div></main><script>(()=>{let credential=null;const form=document.getElementById('form'),status=document.getElementById('status'),result=document.getElementById('result');function show(text){status.textContent='';result.hidden=false;result.textContent=text}async function invite(e){e.preventDefault();if(!credential)return;status.textContent='Creating invitation…';result.hidden=true;const r=await fetch('/api/household-invite',{method:'POST',headers:{Authorization:`Bearer ${credential}`,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({contactEmail:document.getElementById('email').value,contactPhone:document.getElementById('phone').value})});const b=await r.json().catch(()=>null);if(!r.ok||!b?.ok)return show(`Invitation not created: ${b?.error||`HTTP ${r.status}`}`);const url=new URL(b.activationPath,location.origin).href;show(`Invitation created. Share this single-use activation link with the beneficiary. It expires ${new Date(b.expiresAt).toLocaleString()}. ${url}`)}form.addEventListener('submit',invite);function loadGoogle(){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.defer=true;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}async function init(){status.textContent='Loading sign-in…';let c;try{c=await(await fetch('/api/auth-client-config',{headers:{Accept:'application/json'},cache:'no-store'})).json()}catch{return show('Could not load sign-in configuration.')}if(!c?.configured||c.provider!=='google'||!c.clientId)return show('Google sign-in is not configured.');if(c.productionApplicationAccessEnabled!==true)return show('Production application access is disabled.');try{await loadGoogle()}catch{return show('Google Sign-In failed to load.')}status.textContent='';google.accounts.id.initialize({client_id:c.clientId,callback:r=>{if(r?.credential){credential=r.credential;form.hidden=false;document.getElementById('gsi-target').hidden=true}},auto_select:false});google.accounts.id.renderButton(document.getElementById('gsi-target'),{type:'standard',theme:'outline',size:'large',text:'signin_with',width:300})}init()})();</script></body></html>
