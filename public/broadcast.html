<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Member Notices — Workers Food Club</title><link rel="stylesheet" href="/styles.css"></head><body><main style="max-width:900px;margin:auto;padding:2rem"><p class="eyebrow">System Owner · Administration</p><h1>Member Notices</h1><p id="broadcast-access">Verifying authority…</p><div data-view="broadcast" hidden><section class="card"><h2>Send a notice</h2><p>Sent as an in-app notification to every member whose membership isn't ended. There is no undo — review before sending.</p><form id="broadcast-form"><label>Category <select name="eventType" required><option value="DOWNTIME_NOTICE">Downtime notice</option><option value="TOS_CHANGE">Terms of Service change</option><option value="SECURITY_NOTICE">Security notice</option><option value="GENERAL_ANNOUNCEMENT">General announcement</option></select></label><label>Subject <input name="subject" type="text" maxlength="200" required></label><label>Message <textarea name="body" rows="6" maxlength="4000" required></textarea></label><div class="hero-actions" style="margin-top:14px"><button type="submit" class="primary">Send to all members</button></div></form><div id="broadcast-result" class="result-box" hidden></div></section><div class="section-intro"><div><h2>Recently sent</h2></div><span id="broadcast-source" class="badge neutral">Loading…</span></div><div id="broadcast-list" class="timeline-card" aria-live="polite"></div></div><p style="margin-top:24px"><a href="/employee">← Employee Access</a></p></main><script src="/governed-fetch-extension.js"></script><script src="/auth.js"></script><script>window.addEventListener('foodclub:auth-state',function(e){var allowed=e.detail&&e.detail.superUserAccessAvailable===true;var el=document.getElementById('broadcast-access');if(el)el.textContent=allowed?'System Owner / Admin authority confirmed.':'Member notices are restricted to System Owner and Admin.';});</script><script src="/broadcast.js"></script></body></html>
