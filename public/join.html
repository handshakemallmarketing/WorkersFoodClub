<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Food Club Ghana — Apply to join</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body{display:flex;justify-content:center;padding:48px 20px}
    .bootstrap-shell{max-width:480px;width:100%}
    .bootstrap-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}
    .bootstrap-card h1{font-size:22px;margin:6px 0 4px;letter-spacing:-.02em}
    .bootstrap-card p{color:var(--muted);line-height:1.55;margin:0 0 16px}
    #gsi-target{margin:6px 0 4px}
    .bootstrap-result{margin-top:18px;border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
    .bootstrap-result.ok{background:var(--green2);color:var(--green)}
    .bootstrap-result.err{background:var(--redbg);color:var(--red)}
    .bootstrap-status{color:var(--muted);font-size:13px;margin-top:14px}
    textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;resize:vertical;min-height:70px;margin-bottom:14px}
  </style>
</head>
<body>
  <div class="bootstrap-shell">
    <div class="bootstrap-card">
      <p class="eyebrow">Food Club Ghana</p>
      <h1>Apply to join</h1>
      <p>
        Sign in with the Google account you want your WorkersFoodClub membership bound to,
        then submit your request. An Owner or Admin will review it.
      </p>
      <div id="gsi-target"></div>
      <div id="form-area" hidden>
        <textarea id="contact-note" placeholder="Anything you'd like to add (optional)"></textarea>
        <button id="submit-button" type="button" class="primary">Submit application</button>
      </div>
      <p id="status" class="bootstrap-status"></p>
      <div id="result" class="bootstrap-result" hidden></div>
    </div>
  </div>
  <script>
    (() => {
      const statusEl = document.getElementById('status');
      const resultEl = document.getElementById('result');
      const gsiTarget = document.getElementById('gsi-target');
      const formArea = document.getElementById('form-area');
      const contactNoteEl = document.getElementById('contact-note');
      const submitButton = document.getElementById('submit-button');
      let credential = null;

      function setStatus(text) { statusEl.textContent = text || ''; }
      function showResult(ok, html) {
        resultEl.hidden = false;
        resultEl.className = 'bootstrap-result ' + (ok ? 'ok' : 'err');
        resultEl.innerHTML = html;
      }
      function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[ch]));
      }

      const ERROR_EXPLANATIONS = {
        ALREADY_A_MEMBER: 'This Google account already has an active WorkersFoodClub membership. Sign in normally instead.',
        PRODUCTION_APPLICATION_ACCESS_DISABLED: 'Production application access is currently switched off, so applications cannot be submitted yet.',
        DATABASE_URL_MISSING: 'The server has no database connection configured.',
        AUTHENTICATION_REQUIRED: 'No credential reached the server. Try signing in again.',
        TOKEN_EXPIRED_OR_NOT_YET_VALID: 'Your Google sign-in token had already expired. Reload and try again.',
      };

      async function submitApplication() {
        setStatus('Submitting…');
        submitButton.disabled = true;
        try {
          const response = await fetch('/api/membership-apply', {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + credential, 'Content-Type': 'application/json', Accept: 'application/json' },
            body: JSON.stringify({ contactNote: contactNoteEl.value }),
          });
          const body = await response.json().catch(() => null);
          setStatus('');
          submitButton.disabled = false;

          if (response.ok && body && body.ok) {
            formArea.hidden = true;
            showResult(true, body.alreadySubmitted
              ? '<strong>You already have an application awaiting review.</strong><br>No need to submit again — someone will get to it.'
              : '<strong>Application submitted.</strong><br>An Owner or Admin will review it. You can close this page.');
            return;
          }

          const code = body && body.error ? body.error : ('HTTP ' + response.status);
          const explanation = ERROR_EXPLANATIONS[code] || 'See the server logs for details.';
          showResult(false, '<strong>Not completed:</strong> <code>' + escapeHtml(code) + '</code><br>' + escapeHtml(explanation));
        } catch (err) {
          setStatus('');
          submitButton.disabled = false;
          showResult(false, '<strong>Request failed.</strong> Check your connection and try again.');
        }
      }

      submitButton.addEventListener('click', submitApplication);

      function loadGoogleScript() {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = 'https://accounts.google.com/gsi/client';
          script.async = true;
          script.defer = true;
          script.onload = resolve;
          script.onerror = () => reject(new Error('GOOGLE_SCRIPT_LOAD_FAILED'));
          document.head.appendChild(script);
        });
      }

      async function init() {
        setStatus('Loading configuration…');
        let config;
        try {
          const response = await fetch('/api/auth-client-config', { headers: { Accept: 'application/json' }, cache: 'no-store' });
          config = await response.json();
        } catch {
          setStatus('');
          showResult(false, 'Could not reach the server to load sign-in configuration.');
          return;
        }

        if (!config || config.provider !== 'google' || !config.configured || !config.clientId) {
          setStatus('');
          showResult(false, 'Google sign-in is not configured on this deployment yet.');
          return;
        }

        if (config.productionApplicationAccessEnabled !== true) {
          setStatus('');
          showResult(false, 'Production application access is currently disabled, so applications cannot be submitted yet.');
          return;
        }

        setStatus('Loading Google Sign-In…');
        try {
          await loadGoogleScript();
        } catch {
          setStatus('');
          showResult(false, 'Google Sign-In failed to load. Reload the page to retry.');
          return;
        }

        setStatus('');
        window.google.accounts.id.initialize({
          client_id: config.clientId,
          callback: (response) => {
            if (response && response.credential) {
              credential = response.credential;
              formArea.hidden = false;
              setStatus('Signed in. Add anything you\'d like, then submit.');
            }
          },
          auto_select: false,
          cancel_on_tap_outside: true,
        });
        window.google.accounts.id.renderButton(gsiTarget, {
          type: 'standard',
          theme: 'outline',
          size: 'large',
          text: 'signin_with',
          width: 300,
        });
      }

      init();
    })();
  </script>
</body>
</html>
