name: enrollment-member-record-certification
on:
  pull_request:
    paths:
      - 'api/membership-apply.js'
      - 'api/membership-application-decide.js'
      - 'api/membership-renewal-invoice.js'
      - 'api/membership-subscription-settle.js'
      - 'api/member-auth-challenge.js'
      - 'api/member-auth-verify.js'
      - 'api/system-service-settings.js'
      - 'lib/member-auth-challenge-delivery.js'
      - 'lib/external-service-registry.js'
      - 'lib/external-service-runtime.js'
      - 'lib/member-access-policy.js'
      - 'lib/membership-annual-invoice.js'
      - 'tests/node/sw1-membership-apply.test.mjs'
      - 'tests/node/membership-annual-invoice.test.mjs'
      - 'tests/node/membership-subscription-settle.test.mjs'
      - 'tests/node/enrollment-member-record-contract.test.mjs'
      - 'tests/node/enrollment-auth-before-settlement.test.mjs'
      - 'tests/node/system-service-settings-contract.test.mjs'
      - 'public/join.html'
      - 'docs/business-logic-v2/a2-membership-contract.yaml'
      - 'docs/policies/AUTH-MEMBERSHIP-001-member-admission.md'
      - 'docs/business-logic-v2/master-truth-matrix-amendment-external-services-2026-09-20.yaml'
jobs:
  enrollment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/node/sw1-membership-apply.test.mjs tests/node/membership-annual-invoice.test.mjs tests/node/membership-subscription-settle.test.mjs tests/node/enrollment-member-record-contract.test.mjs tests/node/enrollment-auth-before-settlement.test.mjs tests/node/system-service-settings-contract.test.mjs
