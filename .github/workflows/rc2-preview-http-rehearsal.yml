name: rc2-preview-http-rehearsal
on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Exact immutable Vercel deployment URL to attack
        required: true
        type: string
      expected_sha:
        description: Exact Git commit SHA deployed at preview_url
        required: true
        type: string
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Validate rehearsal script
        run: node --check scripts/test-preview-http-rehearsal.mjs
      - name: Attack exact immutable Vercel deployment
        env:
          PREVIEW_BASE_URL: ${{ inputs.preview_url }}
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/test-preview-http-rehearsal.mjs | tee rc2-preview-http-rehearsal-evidence.json
      - name: Upload rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc2-preview-http-rehearsal-${{ inputs.expected_sha }}
          path: rc2-preview-http-rehearsal-evidence.json
          if-no-files-found: warn
          retention-days: 30
