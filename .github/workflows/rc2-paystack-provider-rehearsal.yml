name: rc2-paystack-provider-rehearsal
on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Exact Vercel Preview deployment URL to exercise
        required: true
        type: string
      expected_sha:
        description: Exact Git commit SHA deployed at preview_url
        required: true
        type: string
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    env:
      TARGET_PREVIEW_URL: ${{ inputs.preview_url }}
      TARGET_EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Checkout current RC3 rehearsal harness
        uses: actions/checkout@v4
        with:
          ref: sw1-rc3-production-identity-live-provider-falsification
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.11.7
      - name: Validate provider rehearsal script
        run: node --check scripts/test-paystack-provider-rehearsal.mjs
      - name: Exercise real Paystack test provider through exact protected Preview deployment
        env:
          PREVIEW_BASE_URL: ${{ env.TARGET_PREVIEW_URL }}
          EXPECTED_COMMIT_SHA: ${{ env.TARGET_EXPECTED_SHA }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: food-club
        shell: bash
        run: |
          set -o pipefail
          test -n "$VERCEL_TOKEN" || { echo 'VERCEL_TOKEN_REQUIRED'; exit 1; }
          vercel --version
          node scripts/test-paystack-provider-rehearsal.mjs | tee rc2-paystack-provider-rehearsal-evidence.json
      - name: Upload provider rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc2-paystack-provider-rehearsal-${{ env.TARGET_EXPECTED_SHA }}
          path: rc2-paystack-provider-rehearsal-evidence.json
          if-no-files-found: warn
          retention-days: 30
