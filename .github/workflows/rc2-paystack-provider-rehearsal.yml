name: rc2-paystack-provider-rehearsal
on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Exact Vercel Preview deployment URL to exercise
        required: true
        type: string
      expected_sha:
        description: Exact Git commit SHA deployed at preview_url
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/rc2-paystack-provider-rehearsal.yml
permissions:
  contents: read
  id-token: write
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    env:
      TARGET_PREVIEW_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_url || 'https://workers-food-club-git-sw1-rc2-production-readi-0760c2-food-club.vercel.app' }}
      TARGET_EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || '788df6e1ed867da3ded5621fdf52f75f71332b99' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_EXPECTED_SHA }}
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Validate provider rehearsal script
        run: node --check scripts/test-paystack-provider-rehearsal.mjs
      - name: Mint GitHub OIDC token for Vercel Trusted Sources
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);
      - name: Exercise real Paystack test provider through exact Preview deployment
        env:
          PREVIEW_BASE_URL: ${{ env.TARGET_PREVIEW_URL }}
          EXPECTED_COMMIT_SHA: ${{ env.TARGET_EXPECTED_SHA }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/test-paystack-provider-rehearsal.mjs | tee rc2-paystack-provider-rehearsal-evidence.json
      - name: Upload provider rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc2-paystack-provider-rehearsal-${{ env.TARGET_EXPECTED_SHA }}
          path: rc2-paystack-provider-rehearsal-evidence.json
          if-no-files-found: warn
          retention-days: 30
