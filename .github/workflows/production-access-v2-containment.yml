name: Production Access v2 containment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-access-v2-state-transition
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_WkMSXuSv8kDLoOlGHYtIggZ1
  VERCEL_PROJECT_ID: prj_Ti1NOQryzFeImhMSwncMXNxs01I8
  VERCEL_SCOPE: origin-os
  PRODUCTION_BASE_URL: https://workers-food-club.vercel.app

jobs:
  contain:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Force durable Production application access OFF
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo 'VERCEL_TOKEN missing; cannot execute containment.' >&2; exit 1; }
          curl --silent --show-error --fail-with-body --request POST \
            --url "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}&upsert=true" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" --header 'Content-Type: application/json' \
            --data '[{"key":"PRODUCTION_APPLICATION_ACCESS_ENABLED","value":"false","type":"plain","target":["production"],"comment":"Independent Production Access v2 emergency containment"}]' >/dev/null
      - name: Install pinned deployment tools after durable OFF
        run: |
          npm install --global vercel@59.11.7
          npm install --global pnpm@9.15.4
      - name: Rebuild canonical Production with durable OFF
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf .vercel
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" >/dev/null
          vercel build --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" >/dev/null
      - name: Prove canonical fail-closed state
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            response="$(curl --silent --show-error --write-out $'\n%{http_code}' "${PRODUCTION_BASE_URL}/api/member-orders" || true)"
            status="${response##*$'\n'}"; body="${response%$'\n'*}"
            if [ "$status" = '503' ] && printf '%s' "$body" | grep -q 'PRODUCTION_APPLICATION_ACCESS_DISABLED'; then echo "Canonical Production fail-closed state proven on attempt $attempt."; exit 0; fi
            sleep 2
          done
          echo 'Canonical Production fail-closed state could not be proven.' >&2; exit 1
