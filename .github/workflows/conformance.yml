name: constitutional-conformance
on: [push, pull_request]
permissions:
  contents: read
  statuses: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foodclub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d foodclub_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/foodclub_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Syntax-check production JavaScript surface
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find api lib public scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
      - run: pnpm canon:check
      - run: pnpm traceability:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:kernel
      - run: bash scripts/test-postgres-durability.sh
      - run: bash scripts/test-postgres-backup-restore.sh
      - run: pnpm add -Dw --lockfile=false pg@8.13.1
      - run: node scripts/test-postgres-adapter-race.mjs
      - name: Wait for exact-head Vercel deployment
        if: >-
          github.event_name == 'pull_request' &&
          (github.head_ref == 'sw1-rc2-production-readiness-falsification' ||
           github.head_ref == 'sw1-rc3-production-identity-live-provider-falsification')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/wait-for-vercel-status.mjs
      - name: RC2 preview HTTP rehearsal status
        if: github.event_name == 'pull_request' && github.head_ref == 'sw1-rc2-production-readiness-falsification'
        run: |
          echo "Exact-head Vercel deployment is proven by the preceding status check."
          echo "The live HTTP adversarial rehearsal is intentionally not run against a hard-coded branch alias from this required gate."
          echo "Run the rc2-preview-http-rehearsal workflow with the exact immutable Vercel deployment URL; RC2-E2E-001 remains open until that workflow passes."
      - name: RC3 exact-head deployment boundary status
        if: github.event_name == 'pull_request' && github.head_ref == 'sw1-rc3-production-identity-live-provider-falsification'
        run: |
          echo "RC3 exact-head Preview deployment status is required and proven by the preceding Vercel status check."
          echo "Preview deployment proof does not authorize Production application access, Production writes, or live funds."
          echo "Run the RC3 production identity rehearsal workflow against an exact Production deployment with canonical member/operator bindings before closing RC3-ENV-001 or RC3-REHEARSAL-001."
          echo "Run the RC3 production access rollback rehearsal against an exact Production deployment with PRODUCTION_APPLICATION_ACCESS_ENABLED disabled before closing RC3-ROLLBACK-001."
          echo "Live-provider activation remains a separate release blocker and live funds remain unauthorized."
