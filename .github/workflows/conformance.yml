name: constitutional-conformance
on: [push, pull_request]
jobs:
  conformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foodclub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d foodclub_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/foodclub_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm canon:check
      - run: pnpm traceability:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:kernel
      - run: bash scripts/test-postgres-durability.sh
      - run: pnpm add -Dw --lockfile=false pg@8.13.1
      - run: node scripts/test-postgres-adapter-race.mjs
