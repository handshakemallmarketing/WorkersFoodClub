name: RC3 bounded production identity-enabled rehearsal

on:
  push:
    branches:
      - sw1-rc3-production-identity-live-provider-falsification

permissions:
  contents: read

jobs:
  rehearsal:
    if: "${{ github.event.head_commit.message == 'RC3 execute bounded identity-enabled production rehearsal' }}"
    runs-on: ubuntu-latest
    env:
      REHEARSAL_SHA: e6439c92adc61bde8bc0934ee2f9dfb89b686c02
      VERCEL_ORG_ID: team_wnL0jYsouqFvJ8VJR0jIAhTl
      VERCEL_PROJECT_ID: prj_Y10EuTs8ttzcRg9LZl2BASSiOFUE
    steps:
      - name: Require deployment credential
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo 'VERCEL_TOKEN missing; refusing Production rehearsal.' >&2; exit 1; }

      - name: Checkout immutable green RC3 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REHEARSAL_SHA }}
          fetch-depth: 1

      - name: Verify immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$REHEARSAL_SHA"
          echo "RC3 identity rehearsal candidate: $actual"

      - name: Install repo-pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.11.7

      - name: Pull Production project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope=food-club

      - name: Build immutable candidate with Production semantics
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN" --scope=food-club

      - name: Deploy bounded identity-enabled Production rehearsal
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --yes \
            --token="$VERCEL_TOKEN" \
            --scope=food-club \
            --env PRODUCTION_APPLICATION_ACCESS_ENABLED=true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Identity-enabled rehearsal URL: $url"

      - name: Preserve bounded authorization envelope
        run: |
          echo 'Production application access is enabled only for this bounded rehearsal deployment.'
          echo 'Live funds remain NOT authorized.'
          echo 'Paystack live mode remains NOT authorized.'
          echo 'No Production mutation scope is authorized by this workflow.'
          echo 'Rollback is a fresh Production deployment with PRODUCTION_APPLICATION_ACCESS_ENABLED=false.'

# bounded trigger refresh
