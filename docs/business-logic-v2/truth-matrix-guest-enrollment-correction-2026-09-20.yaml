  - enrollment_requires_no_google_oidc_or_other_identity_provider_authentication
  - enrollment_contact_information_is_not_login_identity_binding
  - application_submission_confers_no_membership_rights
  - approval_establishes_eligibility_not_active_member_login_authority
  - ordinary_membership_activation_requires_confirmed_annual_subscription_settlement
  - google_is_only_a_supported_member_login_option
