    finding: constitution/baseline.json says PROPOSED_FOR_RATIFICATION while agent guidance describes C0-C10 as ratified; substantive C0-C10 text is not discoverable on main.
  - id: P0-PROD-EXACT-HEAD
    severity: P0
    status: CLARIFIED_PARTIAL_CLEANUP_REMAINING
    finding: >-
      Two Vercel deployments of this repository existed, disagreeing on application-access state
      at the same commit. Willie Adofo confirmed directly (BLV2-DEC-014): he personally requested
      PRODUCTION_APPLICATION_ACCESS_ENABLED be turned on for workers-food-club.vercel.app (Vercel
      team OriginOS, prj_Ti1NOQryzFeImhMSwncMXNxs01I8) for real-world testing, done via direct
      Vercel dashboard toggle rather than the documented activation-gate ceremony -- a real,
      intentional authorization, not a rogue/unauthorized one. workers-food-club-chi.vercel.app
      (the old canonical alias) is a real, different Vercel account this session cannot reach or
      delete; Willie wants exactly one canonical project and needs to locate and retire it himself.
      Remediated (BLV2-DEC-015): the activation workflow and governance record (grant v4) on both
      main and the sw1-production-application-access-activation-gate control branch were repointed
      to the real project and current main HEAD, so the ceremony would target the right place and
      not silently roll back the live deployment if fired again. Verified the control-branch push
      did not itself trigger a deployment (GitHub Actions run concluded "skipped", not fired).
      Remaining: Willie locating/retiring the chi project in his own Vercel account(s); four
      older RC3-era workflows referencing the same stale org were left untouched as out of scope.
  - id: P0-DB-ISOLATION
    severity: P0
    status: RESOLVED
    finding: >-
      Confirmed 2026-09-18 by direct human comparison of Production/Preview DATABASE_URL in the
      Vercel dashboard and the Neon console branch list: both resolved to the same Neon branch.
      Remediated same day: a new Neon branch (preview, br-purple-grass-aej54d2x) was forked from
      production, all 15 migrations applied and verified on it, and the human owner repointed the
      Preview scope of Vercel's DATABASE_URL at it, leaving Production untouched throughout.
      End-to-end re-verified 2026-09-18 via the Preview-only
      /api/db-health?probe=database-target-fingerprint hostname-fingerprint endpoint (added in PR
      #97): the human owner opened a live Preview deployment (built from a commit carrying PR #97)
      in their own authenticated browser session and reported back hostSha256
      efecbc10be311dc3b95f981eb70329b7e2402e526399b4414083e96f56549946, which matches, character
      for character, the SHA-256 this agent independently computed from the real preview branch's
      Neon connection hostname (obtained via a separate, authenticated Neon MCP call, never shared
      in chat). This is real evidence the Preview environment now resolves to the isolated branch,
      not an assumption from the dashboard edit alone.
    confirmed_by: human (Willie Adofo), via Vercel + Neon dashboards, 2026-09-18; end-to-end fingerprint match independently verified 2026-09-18
    remediation: Complete. See docs/governance/GO_LIVE_REGISTER.md section 7.
  - id: P1-DB-RECOVERY
    severity: P1
    finding: No scheduled snapshots or completed restore drill; current Neon history retention is six hours.
  - id: P1-AUTH-RUNTIME-PROOF
    severity: P1
    finding: PRs #94 and #95 closed the canonical token/tier-scope and fulfillment-route integration defects; authenticated hosted PostgreSQL E2E, adverse-path and recovery proof remains incomplete.
  - id: P1-DECISIONS
    severity: P1
    finding: The canonical decision register is fragmented and does not index later material decisions.
