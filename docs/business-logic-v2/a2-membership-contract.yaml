version: 0.1
owner: A2
scope: [UC-01, UC-02, UC-03, UC-04]
status: implementation_contract
existing_lineage:
  membership_states: [ACTIVE, SUSPENDED, ENDED]
  governed_eligibility_required: true
  authentication_identity_is_not_member_identity: true
member_application:
  states: [DRAFT, SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED, WITHDRAWN]
  required_core_fields:
    - legal_name
    - primary_email_or_phone
    - worker_or_eligibility_class
    - eligibility_evidence
    - communication_consent
  rules:
    - application_does_not_create_active_membership
    - approval_requires_governed_eligibility_decision
    - duplicate_person_detection_must_not_silently_merge_people
membership_activation:
  rules:
    - canonical_member_identity_is_separate_from_oauth_identity
    - one_participant_may_not_have_two_active_memberships
    - activation_requires_approved_application_and_governed_eligibility
    - suspension_must_not_destroy_identity_or_history
    - restoration_requires_current_authority_and_resolved_restriction_basis
beneficiaries:
  states: [INVITED, ACCEPTED, ACTIVATED, REVOKED, EXPIRED]
  rules:
    - beneficiary_invitation_does_not_create_member_authority
    - activation_link_must_be_single_purpose_and_expiring
    - beneficiary_personal_information_is_supplied_or_confirmed_by_beneficiary
    - sponsor_relationship_and_invitation_lineage_are_auditable
    - slot_limit_is_policy_not_hardcoded_in_domain_truth
membership_billing:
  invoice_states: [ISSUED, DUE, PARTIALLY_SETTLED, SETTLED, PAST_DUE, VOID]
  standing_states: [CURRENT, PAST_DUE, RESTRICTED]
  rules:
    - invoice_is_an_economic_obligation_not_payment
    - payment_intent_does_not_restore_good_standing
    - restoration_requires_authoritative_settlement_or_authorized_adjustment
    - restriction_must_be_policy_driven_and_auditable
    - past_due_restriction_must_not_erase_existing_obligations_or_history
consequential_policy_pending:
  - membership_fee_amount
  - billing_frequency
  - grace_period_length
  - beneficiary_slot_count
  - restriction_scope_for_past_due_members
falsification_required:
  - duplicate_application
  - duplicate_active_membership
  - forged_or_expired_beneficiary_activation
  - beneficiary_slot_race
  - payment_intent_without_settlement
  - settlement_replay
  - suspend_restore_authority_revocation
